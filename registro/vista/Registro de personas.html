        <h1>Registro de Servidores Públicos</h1>
        <br>

        <div class="container mt-4">
            <form action="../controlador/Formulario_de_Registro.php" method="POST">

                <div class="formulario">
                    <h2>Registrar persona:</h2>   

                    <!-- APELLIDO PATERNO -->
                    <label for="apellido_paterno">Apellido Paterno:</label>
                    <input 
                        type="text" 
                        id="apellido_paterno" 
                        name="Apellido_Paterno" 
                        placeholder="Ej. López (TEXTO)" 
                        required
                    >
                    <br><br>

                    <!-- APELLIDO MATERNO -->
                    <label for="apellido_materno">Apellido Materno:</label>
                    <input 
                        type="text" 
                        id="apellido_materno" 
                        name="Apellido_Materno" 
                        placeholder="Ej. Pérez (TEXTO)" 
                        required
                    >
                    <br><br>

                    <!-- NOMBRE -->
                    <label for="nombre">Nombre:</label>
                    <input 
                        type="text" 
                        id="nombre" 
                        name="Nombre" 
                        placeholder="Ej. Juan (TEXTO)" 
                        required
                    >
                    <br><br>

                    <!-- RFC -->
                    <label for="rfc">RFC:</label>
                    <input 
                        type="text" 
                        id="rfc" 
                        name="RFC" 
                        maxlength="13" 
                        placeholder="Ej. LOPJ900101XXX (TEXTO)" 
                        style="text-transform: uppercase;" 
                        required
                    >
                    <br><br>

                    <!-- CURP -->
                    <label for="curp">CURP:</label>
                    <input 
                        type="text" 
                        id="curp" 
                        name="CURP" 
                        maxlength="18" 
                        placeholder="Ej. LOPJ900101HDFXXX01 (TEXTO)" 
                        style="text-transform: uppercase;" 
                        required
                    >
                    <br><br>

                    <!-- FECHA DE NACIMIENTO -->
                    <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
                    <input 
                        type="date" 
                        id="fecha_nacimiento" 
                        name="Fecha_de_Nacimiento" 
                        required
                    >
                    <br><br>

                    <!-- ESCOLARIDAD -->
                     <div class="campo">
                            <label for="tipo_Escolaridad">Escolaridad:</label>
            <input list="lista-Escolaridad" id="Escolaridad" name="Escolaridad" placeholder="Escribe o selecciona una opción">
            
            <datalist id="lista-Escolaridad">
                        <option value="">Selecciona una opción (SELECCIÓN)</option>
                        <option value="Primaria">Primaria</option>
                        <option value="Secundaria">Secundaria</option>
                        <option value="Preparatoria">Preparatoria</option>
                        <option value="Universidad">Universidad</option>
                        <option value="Posgrado">Posgrado</option>
                    </select>
                    <br><br>
                    </datalist>
                     </div>

                    <!-- ESTADO CIVIL -->
                    <div class="campo">
                            <label for="tipo_Civil">Estado Civil:</label>
            <input list="lista-Estado Civil" id="Estado Civil" name="Estado Civil" placeholder="Escribe o selecciona una opción">
            
            <datalist id="lista-Estado Civil">
                        <option value="SOLTERO/A">SOLTERO/A</option>
                        <option value="CASADO/A">CASADO/A</option>
                        <option value="DIVORCIADO/A">DIVORCIADO/A</option>
                        <option value="UNION LIBRE">UNION LIBRE</option>
                    </select>
                    <br><br>
            </datalist>
                    </div>

                    <!-- COLONIA -->
                    <label for="colonia">Colonia:</label>
                    <input 
                        type="text" 
                        id="colonia" 
                        name="Colonia" 
                        placeholder="Ej. Centro (TEXTO)" 
                        required
                    >
                    <br><br>

                    <!-- CALLE -->
                    <label for="calle">Calle:</label>
                    <input 
                        type="text" 
                        id="calle" 
                        name="Calle" 
                        placeholder="Ej. Av. Hidalgo No. 12 (TEXTO)" 
                        required
                    >
                    <br><br>

                    <!-- MUNICIPIO -->
                    <label for="municipio">Municipio:</label>
                    <input 
                        type="text" 
                        id="municipio" 
                        name="Municipio" 
                        placeholder="Ej. Toluca (TEXTO)" 
                        required
                    >
                    <br><br>

                    <!-- CÓDIGO POSTAL -->
                    <label for="codigo_postal">Código Postal:</label>
                    <input 
                        type="text" 
                        id="codigo_postal" 
                        name="Codigo_Postal" 
                        maxlength="5" 
                        placeholder="Ej. 50000 (NUMERO)" 
                        required
                    >
                    <br><br>

                    <!-- TELÉFONO -->
                    <label for="celular">Teléfono / Celular:</label>
                    <input 
                        type="tel" 
                        id="celular" 
                        name="Telefono" 
                        maxlength="10" 
                        placeholder="Ej. 7221234567 (NUMERO)" 
                        required
                    >
                    <br><br>

                    <!-- BOTONES -->
                    <div class="botones">
                        <button type="submit">Guardar Registro</button>
                        <button type="reset">Limpiar</button>
                    </div>

                </div>
                              <!-- === COLOCA ESTO AL FINAL DE TU CONTENIDO (antes de </body>) === -->


            </form>
        </div>
    </div>

<script>
  // Cargar el archivo CSV subiendo un nivel desde la carpeta "vista"
  fetch('../empleados.csv')
    .then(response => response.text())
    .then(datos => {
      const filas = datos.split('\n');
      const tbody = document.querySelector('#tabla-servidores tbody');
      tbody.innerHTML = ''; // Limpiar la tabla

      // Recorrer cada fila empezando desde la 1 para omitir los encabezados del CSV
      for (let i = 1; i < filas.length; i++) {
        const columna = filas[i].split(',');
        if (columna.length > 1) {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${columna[0] || ''}</td>
            <td>${columna[1] || ''}</td>
            <td>${columna[3] || ''}</td>
            <td>${columna[11] || ''}</td>
          `;
          tbody.appendChild(tr);
        }
      }
    })
    .catch(error => console.error('Error al cargar el CSV:', error));
</script>



</body>
